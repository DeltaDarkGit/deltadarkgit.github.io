<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anillo — Job Operation Status</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f4f0;
  --surface: #ffffff;
  --surface2: #f9f8f5;
  --border: #e2e0d8;
  --border-hi: #c8c5bc;
  --osp-color: #c0501e;
  --press-color: #1a6b3a;
  --linsp-color: #1a4b8c;
  --text: #1a1a18;
  --text-muted: #6b6a64;
  --text-dim: #b0ae a6;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.05);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.1), 0 2px 4px rgba(0,0,0,0.06);
  --shadow-lg: 0 12px 40px rgba(0,0,0,0.14), 0 4px 10px rgba(0,0,0,0.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'IBM Plex Sans', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* HEADER */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 28px;
  height: 58px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: var(--shadow-sm);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-logo {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 18px;
  font-weight: 600;
  letter-spacing: -0.03em;
  color: var(--text);
}

.brand-sep { color: var(--border-hi); font-weight: 300; }

.brand-sub {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-muted);
  letter-spacing: 0.02em;
  text-transform: uppercase;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 20px;
  font-size: 12px;
  color: var(--text-muted);
}

.company-chip {
  background: #1a1a18;
  color: #fff;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 4px;
  letter-spacing: 0.05em;
}

/* TOOLBAR */
.toolbar {
  padding: 10px 28px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface);
}

.btn {
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 12px;
  font-weight: 500;
  padding: 6px 14px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.15s;
}
.btn:hover { border-color: var(--border-hi); color: var(--text); background: var(--surface); box-shadow: var(--shadow-sm); }

.toolbar-sep { flex: 1; }

.stats-row {
  display: flex;
  align-items: center;
  gap: 20px;
  font-size: 12px;
}

.stat {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--text-muted);
  font-weight: 500;
}

.stat-dot {
  width: 9px; height: 9px;
  border-radius: 2px;
}

.stat strong { color: var(--text); font-weight: 600; }

/* WORKSPACE */
.workspace {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0;
  overflow: hidden;
}

/* TABLE PANEL */
.table-panel {
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border);
  overflow: hidden;
  background: var(--bg);
  transition: background 0.2s;
}
.table-panel:last-child { border-right: none; }

.table-panel.drag-over { background: #edf3ff; }

/* Panel header */
.panel-header {
  padding: 16px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: flex-start;
  gap: 14px;
  flex-shrink: 0;
}

.accent-stripe {
  width: 4px;
  border-radius: 3px;
  align-self: stretch;
  min-height: 40px;
  flex-shrink: 0;
}

.header-info { flex: 1; min-width: 0; }

.table-id {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 2px;
}

.table-fullname {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
}

.table-ops {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
}

.row-counter {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 28px;
  font-weight: 400;
  color: var(--border-hi);
  letter-spacing: -0.04em;
  line-height: 1;
  flex-shrink: 0;
}

/* Col headers */
.col-header {
  display: grid;
  grid-template-columns: 26px 80px 1fr 80px 55px;
  gap: 0;
  padding: 5px 20px;
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
  font-size: 9px;
  font-family: 'IBM Plex Mono', monospace;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  flex-shrink: 0;
}

/* Panel body */
.panel-body {
  flex: 1;
  overflow-y: auto;
  position: relative;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.panel-body::-webkit-scrollbar { width: 4px; }
.panel-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* Drop state outline */
.table-panel.drag-over .panel-body {
  outline: 2px dashed #4d7fff;
  outline-offset: -2px;
}

/* Empty state */
.empty-state {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: 12px;
  color: var(--border-hi);
  pointer-events: none;
}
.empty-icon { font-size: 24px; opacity: 0.4; }

/* DATA ROW */
.data-row {
  display: grid;
  grid-template-columns: 26px 80px 1fr 80px 55px;
  align-items: center;
  height: 38px;
  padding: 0 20px;
  border-bottom: 1px solid var(--border);
  cursor: grab;
  transition: background 0.1s, box-shadow 0.1s;
  background: var(--surface);
  user-select: none;
}
.data-row:last-child { border-bottom: none; }
.data-row:hover { background: #fafaf7; }
.data-row:hover .grip { opacity: 1; }
.data-row.is-dragging { opacity: 0.3; }
.data-row:active { cursor: grabbing; }

.grip {
  font-size: 13px;
  color: var(--border-hi);
  opacity: 0;
  transition: opacity 0.12s;
  line-height: 1;
}

.cell-job {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.cell-part {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.op-badge {
  display: inline-flex;
  align-items: center;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 4px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.cell-minoper {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--text-muted);
  text-align: right;
}

/* DRAG PHANTOM */
#phantom {
  position: fixed;
  pointer-events: none;
  z-index: 9999;
  display: none;
  background: white;
  border: 1px solid #4d7fff;
  border-radius: 8px;
  padding: 8px 14px;
  font-size: 12px;
  color: var(--text);
  box-shadow: var(--shadow-lg);
  transform: rotate(1deg);
  white-space: nowrap;
  gap: 10px;
  align-items: center;
  font-family: 'IBM Plex Mono', monospace;
}
#phantom.show { display: flex; }
#ph-job { font-weight: 600; }
#ph-part { color: var(--text-muted); font-size: 10px; }

/* FOOTER */
footer {
  height: 32px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 28px;
  font-size: 11px;
  color: var(--text-muted);
  gap: 16px;
  flex-shrink: 0;
}
footer span { display: flex; align-items: center; gap: 4px; }
</style>
</head>

;

const TABLE_META = {
  OSP:   { label: 'Outside Process', color: '#c0501e', lightBg: 'rgba(192,80,30,0.08)', lightText: '#8b3010' },
  PRESS: { label: 'Press',           color: '#1a6b3a', lightBg: 'rgba(26,107,58,0.08)', lightText: '#0e4826' },
  LINSP: { label: 'Inspector',       color: '#1a4b8c', lightBg: 'rgba(26,75,140,0.08)', lightText: '#0f3266' },
};

// Deep clone initial data
const initData = JSON.parse(JSON.stringify(RAW_DATA));
const state = JSON.parse(JSON.stringify(RAW_DATA));

let drag = { on: false, rowIdx: null, src: null, rowData: null };

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  const ws = document.getElementById('workspace');
  ws.innerHTML = '';
  Object.keys(TABLE_META).forEach(tid => ws.appendChild(buildPanel(tid)));
  renderStats();
}

function buildPanel(tid) {
  const meta = TABLE_META[tid];
  const rows = state[tid];

  // Unique operations for subtitle
  const ops = [...new Set(rows.map(r => r.Operation))].slice(0, 4).join(', ');

  const panel = document.createElement('div');
  panel.className = 'table-panel';
  panel.dataset.tid = tid;

  panel.innerHTML = `
    <div class="panel-header">
      <div class="accent-stripe" style="background:${meta.color}"></div>
      <div class="header-info">
        <div class="table-id" style="color:${meta.color}">${tid}</div>
        <div class="table-fullname">${meta.label}</div>
        <div class="table-ops">${ops}${rows.length > 4 ? ' …' : ''}</div>
      </div>
      <div class="row-counter" id="rcount-${tid}">${rows.length}</div>
    </div>
    <div class="col-header">
      <span></span><span>Job #</span><span>Part</span><span>Operation</span><span>MinOper</span>
    </div>
    <div class="panel-body" id="body-${tid}"></div>
  `;

  renderBody(tid, panel.querySelector('.panel-body'));

  panel.addEventListener('dragover', e => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    panel.classList.add('drag-over');
  });
  panel.addEventListener('dragleave', e => {
    if (!panel.contains(e.relatedTarget)) panel.classList.remove('drag-over');
  });
  panel.addEventListener('drop', e => {
    e.preventDefault();
    panel.classList.remove('drag-over');
    if (!drag.on || drag.src === tid) return;
    moveRow(drag.rowIdx, drag.src, tid);
  });

  return panel;
}

function renderBody(tid, bodyEl) {
  bodyEl.innerHTML = '';
  const rows = state[tid];
  const meta = TABLE_META[tid];

  if (rows.length === 0) {
    bodyEl.innerHTML = '<div class="empty-state"><div class="empty-icon">○</div><span>Drop rows here</span></div>';
    return;
  }

  rows.forEach((row, idx) => {
    const el = document.createElement('div');
    el.className = 'data-row';
    el.draggable = true;

    el.innerHTML = `
      <span class="grip">⠿</span>
      <span class="cell-job">${row['Job Number']}</span>
      <span class="cell-part">${row['Part']}</span>
      <span class="op-badge" style="background:${meta.lightBg};color:${meta.lightText}">${row['Operation']}</span>
      <span class="cell-minoper">${row['MinOper']}</span>
    `;

    el.addEventListener('dragstart', e => {
      drag = { on: true, rowIdx: idx, src: tid, rowData: row };
      el.classList.add('is-dragging');
      e.dataTransfer.effectAllowed = 'move';
      const c = document.createElement('canvas'); c.width = c.height = 1;
      e.dataTransfer.setDragImage(c, 0, 0);
      document.getElementById('ph-job').textContent = row['Job Number'];
      document.getElementById('ph-part').textContent = row['Part'];
      document.getElementById('phantom').classList.add('show');
    });

    el.addEventListener('dragend', () => {
      el.classList.remove('is-dragging');
      document.getElementById('phantom').classList.remove('show');
      document.querySelectorAll('.table-panel').forEach(p => p.classList.remove('drag-over'));
      drag = { on: false };
    });

    bodyEl.appendChild(el);
  });
}

// Track mouse for phantom
document.addEventListener('dragover', e => {
  const ph = document.getElementById('phantom');
  if (ph.classList.contains('show')) {
    ph.style.left = (e.clientX + 14) + 'px';
    ph.style.top  = (e.clientY - 24) + 'px';
  }
});

// ── Move ─────────────────────────────────────────────────────────────────────
function moveRow(rowIdx, srcId, destId) {
  const [row] = state[srcId].splice(rowIdx, 1);
  row['ResourceGrpID'] = destId;
  row['Resource Group'] = TABLE_META[destId].label;
  state[destId].push(row);

  const srcBody  = document.getElementById('body-' + srcId);
  const destBody = document.getElementById('body-' + destId);
  renderBody(srcId, srcBody);
  renderBody(destId, destBody);
  document.getElementById('rcount-' + srcId).textContent  = state[srcId].length;
  document.getElementById('rcount-' + destId).textContent = state[destId].length;
  renderStats();

  // brief flash
  destBody.style.transition = 'background 0.08s';
  destBody.style.background = '#edf3ff';
  setTimeout(() => destBody.style.background = '', 380);

  drag = { on: false };
}

// ── Stats ─────────────────────────────────────────────────────────────────────
function renderStats() {
  document.getElementById('stats-row').innerHTML = Object.keys(TABLE_META).map(tid =>
    `<div class="stat">
      <div class="stat-dot" style="background:${TABLE_META[tid].color}"></div>
      ${tid}: <strong>${state[tid].length}</strong>
    </div>`
  ).join('');
}

// ── Toolbar ───────────────────────────────────────────────────────────────────
function resetAll() {
  Object.keys(state).forEach(k => { state[k] = JSON.parse(JSON.stringify(initData[k])); });
  render();
}

function sortByJob() {
  Object.keys(state).forEach(k => {
    state[k].sort((a, b) => String(a['Job Number']).localeCompare(String(b['Job Number']), undefined, {numeric: true}));
  });
  Object.keys(TABLE_META).forEach(tid => {
    const body = document.getElementById('body-' + tid);
    if (body) renderBody(tid, body);
  });
}

render();
</script>
